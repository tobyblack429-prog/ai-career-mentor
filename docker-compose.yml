# ──────────────────────────────────────────────────────────────────────────────
# 🐳 AI Career Mentor - Docker Compose (Development & Production)
# ──────────────────────────────────────────────────────────────────────────────
# 
# Usage:
#   Development:  docker-compose up --build
#   Production:   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up --build
#   Stop:         docker-compose down
#   Clean:        docker-compose down -v
# ──────────────────────────────────────────────────────────────────────────────

version: '3.8'

services:
  # ────────────────────────────────────────────────────────────────────────────
  # 🔙 Backend Service (FastAPI + LangGraph)
  # ────────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-career-mentor-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # AI Providers
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_MODEL=${GOOGLE_MODEL:-gemini-3.5-flash}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_MODEL=${NVIDIA_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      
      # Database
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./dev.db}
      
      # Auth
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      - APP_ENV=${APP_ENV:-development}
      
      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      
      # Redis (Rate Limiting)
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      
      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - backend-data:/app/data
      # DEV ONLY: Uncomment below for hot-reload during development
      # - ./backend:/app
    networks:
      - ai-career-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ────────────────────────────────────────────────────────────────────────────
  # 🔜 Frontend Service (Next.js)
  # ────────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    container_name: ai-career-mentor-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    networks:
      - ai-career-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ────────────────────────────────────────────────────────────────────────────
  # 🗄️ Redis Service (For Rate Limiting - Local Development)
  # ────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai-career-mentor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ai-career-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ────────────────────────────────────────────────────────────────────────────
  # 🗃️ PostgreSQL Service (Optional - For Local Development)
  # ────────────────────────────────────────────────────────────────────────────
  # Uncomment to use PostgreSQL instead of SQLite locally
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: ai-career-mentor-postgres
  #   restart: unless-stopped
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     - POSTGRES_USER=${POSTGRES_USER:-ai_mentor}
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
  #     - POSTGRES_DB=${POSTGRES_DB:-ai_career_mentor}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - ai-career-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_mentor}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

networks:
  ai-career-network:
    driver: bridge

volumes:
  backend-data:
    driver: local
  redis-data:
    driver: local
  # postgres-data:
  #   driver: local
